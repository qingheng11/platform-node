[package]
name = "compute-scheduler"
version = "0.1.0"
edition = "2021"
description = "Compute platform compute scheduler"
license = "MIT"
publish = false

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
platform-node-link = { path = "../../crates/platform-node-link" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "net", "time", "signal", "io-util", "sync", "macros", "process"] }
uuid = { version = "1", features = ["v4", "serde"] }
