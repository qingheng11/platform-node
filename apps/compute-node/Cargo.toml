[package]
name = "compute-node"
version = "0.1.0"
edition = "2021"
description = "Compute platform compute node"
license = "UNLICENSED"
publish = false

[[bin]]
name = "compute-node"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
dirs = "6"
hardware-probe = { path = "../../crates/hardware-probe" }
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
nvml-wrapper = "0.12"
platform-node-link = { path = "../../crates/platform-node-link" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "net", "time", "signal", "io-util", "sync", "macros", "process"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
